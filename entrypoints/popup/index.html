<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="style.css" />
	<title>SNOW Bot Controller</title>
</head>
<body>
	<header id="header" class="controller-header goback-hidden">
		<button type="button" id="controller-goback" class="controller-goback"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/></svg></button><!--
		--><div class="controller-title">
			<div id="controller_title_main" class="controller-title-main popup">
				<div>SNOW Bot</div>
				<div id="open_new_tab">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><!--!Font Awesome Free v6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M320 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l82.7 0L201.4 265.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L448 109.3l0 82.7c0 17.7 14.3 32 32 32s32-14.3 32-32l0-160c0-17.7-14.3-32-32-32L320 0zM80 32C35.8 32 0 67.8 0 112L0 432c0 44.2 35.8 80 80 80l320 0c44.2 0 80-35.8 80-80l0-112c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 112c0 8.8-7.2 16-16 16L80 448c-8.8 0-16-7.2-16-16l0-320c0-8.8 7.2-16 16-16l112 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L80 32z"/></svg>
				</div>
			</div>
			<div id="title_sub" class="controller-title-sub"></div>
		</div><!--
		--><div id="active-toggler" class="activeState-button" role="button" tabindex="0"><!--
			  Power button taken from Font Awesome v4.7.0 by Dave Gandy.
			  --><svg viewBox="0 0 1536 1664">
					<path id="power-off-path"
						d="m 1536,896 q 0,156 -61,298 -61,142 -164,245 -103,103 -245,164 -142,61 -298,61 -156,0 -298,-61 Q 328,1542 225,1439 122,1336 61,1194 0,1052 0,896 0,714 80.5,553 161,392 307,283 q 43,-32 95.5,-25 52.5,7 83.5,50 32,42 24.5,94.5 Q 503,455 461,487 363,561 309.5,668 256,775 256,896 q 0,104 40.5,198.5 40.5,94.5 109.5,163.5 69,69 163.5,109.5 94.5,40.5 198.5,40.5 104,0 198.5,-40.5 Q 1061,1327 1130,1258 1199,1189 1239.5,1094.5 1280,1000 1280,896 1280,775 1226.5,668 1173,561 1075,487 1033,455 1025.5,402.5 1018,350 1050,308 q 31,-43 84,-50 53,-7 95,25 146,109 226.5,270 80.5,161 80.5,343 z m -640,-768 0,640 q 0,52 -38,90 -38,38 -90,38 -52,0 -90,-38 -38,-38 -38,-90 l 0,-640 q 0,-52 38,-90 38,-38 90,-38 52,0 90,38 38,38 38,90 z" />
			</svg><div id="active-label" class="activeState-label">loading...</div><!--
	   --></div>
	</header>
	
	<div id="menu" class="menu">
		<div class="menu-item">
			<div id="templates" class="menu-item-title">Templates</div>
			<div class="menu-item-container">
				<div id="template_form_spoiler" class="spoiler-container">
					<div id="template_form_spoiler_title" class="spoiler-title">Create new template</div>
					<div class="template-form spoiler-content">
						<input type="text" id="template-name-input" placeholder="Template name" class="template-input" />
						<textarea id="template-content-textarea" placeholder="Template content" rows="5" class="template-textarea"></textarea>
						<button id="template-save-btn" type="button" class="btn-primary">Save Template</button>
					</div>
					<table id="table" class="table">
						<thead>
							<tr>
								<th>Name</th>
								<th>Actions</th>
							</tr>
						</thead>
						<tbody id="templates-tbody">
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div class="menu-item">
			<div id="scripting" class="menu-item-title"> Script Editor</div>
			<div id="scripting_container" class="menu-item-container" style="padding: 0 0.6rem;"></div>
		</div>


		<div class="menu-item">
			<div id="logs" class="menu-item-title">Logs</div>
			<div id="logs_container" class="menu-item-container"></div>
		</div>

		<div class="menu-item">
			<div id="settings" class="menu-item-title">Settings</div>
			<div class="menu-item-container">
				<div style="margin-bottom: 1rem;">
					<input type="file" id="shared-import-input" accept=".json" style="display: none;" />
					<button id="shared-export-btn" type="button" class="btn-insert" style="margin-left: .5rem">Export Settings</button>
					<button id="shared-import-btn" type="button" class="btn-delete" style="margin-left: .5rem">Import Settings</button>
				</div>
				<div id="checkbox_settings" class="checkbox_settings" style="margin: 1rem;"></div>
			</div>
		</div>


	</div>

	<script src="main.js" type="module"></script>
</body>
</html>
